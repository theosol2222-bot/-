[project]
name = "clipfactory"
version = "0.1.0"
description = "Usine à clips automatisée : streams Twitch francophones → vidéos TikTok 9:16"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "httpx>=0.27",
  "websockets>=12",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlink>=7",
  "faster-whisper>=1.0",
  "opencv-python-headless>=4.9,<5",
  # scenedetect exige opencv-python : sans borne, pip installe OpenCV 5 qui écrase le module cv2 4.x
  "opencv-python>=4.9,<5",
  # Windows n'a pas de base de fuseaux horaires système : sans tzdata, ZoneInfo("Europe/Paris") échoue
  "tzdata; sys_platform == 'win32'",
  "anthropic>=2.14",
  "scenedetect>=0.6.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-image>=0.22", "piper-tts>=1.2", "pillow>=10"]

[project.scripts]
clipfactory = "clipfactory.__main__:main"

[tool.setuptools.packages.find]
include = ["clipfactory*"]

[tool.setuptools.package-data]
clipfactory = ["web/static/*", "media/models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: tests de bout en bout lents (Whisper + FFmpeg)"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
